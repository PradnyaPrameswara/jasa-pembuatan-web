name: Remove legacy classname dependencies (temporary)
on:
  push:
    branches: [refactor/shadcn-official-components]
permissions:
  contents: write
jobs:
  clean:
    if: github.ref == 'refs/heads/refactor/shadcn-official-components'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install current dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove obsolete class-merging dependencies
        run: pnpm remove clsx tailwind-merge
      - name: Commit lockfile cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove obsolete class-merge dependencies"
            git push origin HEAD:refs/heads/refactor/shadcn-official-components
          fi
