name: Refresh pnpm lockfile (temporary)
on:
  push:
    branches: [fix/linkedin-profile-and-astro-quality]
permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/fix/linkedin-profile-and-astro-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit new lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize pnpm lockfile"
            git push origin HEAD:refs/heads/fix/linkedin-profile-and-astro-quality
          fi
